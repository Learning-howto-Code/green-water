<!DOCTYPE html>
<html>
<head>
    <title>Data Collection</title>
    <style>
        body {
            background: #d4a276;
            color: #87986a;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            color: #87986a;
            margin-bottom: 1rem;
        }
        form {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }
        button {
            padding: 1rem 2rem;
            font-size: 1.25rem;
            border: none;
            border-radius: 10px;
            background-color: #87986a;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        .stream {
            border: 4px solid #38bdf8;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }
        footer {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: auto;
        }
    </style>
    <script>
        document.addEventListener("keydown", function(event) {
            const keys = ['w', 'a', 's', 'd', 'x'];
            if (keys.includes(event.key.toLowerCase())) {
                fetch("/", {
                    method: "POST",
                    headers: {"Content-Type": "application/x-www-form-urlencoded"},
                    body: "key=" + event.key.toLowerCase()
                }).then(() => location.reload());
            }
        });
    </script>
</head>
<body>
  <div id="flash-container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash-banner">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <div id="local-status" style="display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%); background:#2f5d50; color:#fff; padding:10px 16px; border-radius:8px; z-index:9999;">
    Capturing images...
  </div>

  <h1>Data Collection</h1>
  <img class="stream" src="/stream.mjpg" width="640" height="480" alt="Live Camera Feed">
  <form method="POST" onsubmit="showLocalStatus()">
      <button name="key" value="gb">Garbage Disposal</button>
      <button name="key" value="t">Toilet</button>
  </form>

  <script>
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".flash-banner").forEach((el) => {
      setTimeout(() => {
        el.classList.add("hide");
        setTimeout(() => el.remove(), 400);
      }, 5000);
    });
  });

  function showLocalStatus() {
    const el = document.getElementById("local-status");
    el.style.display = "block";
  }
</script>
</body>
</html>
